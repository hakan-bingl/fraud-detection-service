server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: fraud-detection-service
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      indent-output: true

  # Embedded H2 by default for standalone execution & test suites
  datasource:
    url: jdbc:h2:mem:fraud_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      repositories:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

fraud:
  rules:
    rejection-threshold: 70
    salt: "softpay-secure-production-salt-2026"
    amount-rule:
      base-max-amount-eur: 5000.00
      threat-deduction-factor: 0.90
      warning-threshold-ratio: 0.70
    terminal-velocity-rule:
      window-seconds: 60
      base-max-tx-per-window: 10
      threat-deduction-factor: 0.80
      min-allowed-tx: 2
      score: 85
    card-velocity-rule:
      window-seconds: 60
      max-tx-per-window: 3
      score: 90

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.softpay.fraud: DEBUG
